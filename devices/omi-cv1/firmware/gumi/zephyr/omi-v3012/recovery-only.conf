# Gumi Omi CV1 recovery-only application profile.
#
# Keep the update path and PDM-off proof alive; exclude every functional capture subsystem.

CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_PM_DEVICE=y
CONFIG_ENTROPY_GENERATOR=y

# External QSPI secondary slot used by MCU Manager image upload.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_FLASH=y
CONFIG_FLASH_JESD216_API=y

# Preserve the exact stock settings partition and its contents. Recovery does not load or mutate it.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y

# Configure the exact PDM device but never issue DMIC_TRIGGER_START.
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO_DMIC_NRFX_PDM=y
CONFIG_NRFX_PDM0=y

CONFIG_HEAP_MEM_POOL_SIZE=30000
CONFIG_MAIN_STACK_SIZE=4096

# Recovery transport and application-image-0 update path.
CONFIG_BT=y
# Recovery must remain reachable on a sealed unit without an existing bond. The transport is
# intentionally unauthenticated for this development stage; accepted bytes are still constrained by
# MCUboot compatibility plus the application-image-0 admission hook below.
CONFIG_BT_SMP=n
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_DEVICE_APPEARANCE=22
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_CONN_TX_MAX=20
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Assemble the minimal BLE/SMP image-0 update path explicitly. Nordic's
# NCS_SAMPLE_MCUMGR_BT_OTA_DFU convenience option is intentionally off because it forces a
# destructive settings-storage erase handler into any build that preserves the settings partition.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=n
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_STREAM_FLASH=y
CONFIG_STREAM_FLASH_ERASE=y
CONFIG_FLASH_MAP=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_RESET_MS=250
CONFIG_REBOOT=y
CONFIG_MCUMGR_GRP_IMG_ALLOW_ERASE_PENDING=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y

# Reject image-1/network-core upload requests in firmware, even if a client asks for them.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y

# Verify the received application bytes and reject artifacts larger than MCUboot can swap.
CONFIG_IMG_ENABLE_IMAGE_CHECK=y
CONFIG_MCUMGR_GRP_IMG_TOO_LARGE_SYSBUILD=y

# Nordic's convenience DFU option enables these when settings exist. Recovery preserves settings;
# it must never expose the unauthenticated storage-erase command or unrelated echo/info handlers.
CONFIG_MCUMGR_GRP_ZBASIC=n
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n
CONFIG_MCUMGR_GRP_OS_ECHO=n
# Retain the read-only transport-parameter query used by Nordic clients with packet reassembly.
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=n

# Stable sealed-unit identity plus a distinct application revision.
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DEVICE_NAME="Omi"
CONFIG_BT_DIS_MODEL="Omi CV 1"
CONFIG_BT_DIS_MANUF="Based Hardware"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_SW_REV=y
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_FW_REV_STR="3.0.12"
CONFIG_BT_DIS_SW_REV_STR="gumi-recovery-only-0001"
CONFIG_BT_DIS_HW_REV_STR="5.0"

# No stock functional subsystem is admitted in this image.
CONFIG_OMI_CODEC_OPUS=n
CONFIG_OMI_ENABLE_OFFLINE_STORAGE=n
CONFIG_OMI_ENABLE_ACCELEROMETER=n
CONFIG_OMI_ENABLE_BUTTON=n
CONFIG_OMI_ENABLE_SPEAKER=n
CONFIG_OMI_ENABLE_BATTERY=n
CONFIG_OMI_ENABLE_USB=n
CONFIG_OMI_ENABLE_HAPTIC=n
CONFIG_OMI_ENABLE_RFSW_CTRL=n
